
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Secret Gate ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Georgia, serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #18051f, #650b49, #160d32);
}

.card {
    width: 100%;
    max-width: 500px;
    padding: 35px 22px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 25px;
    background: rgba(255,255,255,.10);
    box-shadow: 0 0 35px rgba(255,20,147,.25);
}

h1 {
    color: #ffd6ed;
    font-size: clamp(22px, 6vw, 38px);
    white-space: nowrap;
    letter-spacing: 1px;
    line-height: 1.2;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(255, 20, 147, .5);
}

.message {
    color: #f8d8eb;
    line-height: 1.7;
}

.timer {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 30px 0;
}

.time-box {
    min-width: 65px;
    padding: 14px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,.13);
}

.time-box span {
    display: block;
    font-size: 27px;
    color: #ffd700;
}

.time-box small {
    font-size: 11px;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
}

input {
    text-align: center;
    background: white;
    color: #333;
}

button {
    background: linear-gradient(90deg, #ff1493, #a000b5);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#gate {
    display: none;
}

#error {
    color: #ffb4c8;
    min-height: 24px;
}

</style>
</head>

<body>

<div class="card">

    <h1>❤️ The Secret Gate ❤️</h1>

    <p class="message" id="message">
        Something special is waiting for you.
        <br>
        Your little surprise will unlock soon...
    </p>

    <div class="timer" id="timer">
        <div class="time-box">
            <span id="days">00</span>
            <small>DAYS</small>
        </div>

        <div class="time-box">
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>MINUTES</small>
        </div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>SECONDS</small>
        </div>
    </div>

    <div id="gate">
        <h2>🔐 The Secret Gate</h2>
        <p class="message">Enter your secret code to open your surprise ❤️</p>

        <input
            type="password"
            id="secretCode"
            placeholder="Enter your secret code"
        >

        <button onclick="checkCode()">UNLOCK MY SURPRISE ❤️</button>

        <p id="error"></p>
    </div>

</div>

<script>
// Set the unlock date: 6 November 2026, 12:00 AM Pakistan time
const unlockDate = new Date("2026-11-06T00:00:00+05:00");

// Change this to your own secret code
const SECRET_CODE = "HAPPY Z BIRTHDAY";

// Your main website page
const MAIN_WEBSITE = "index.html";

function updateTimer() {
    const now = Date.now();
    const difference = unlockDate.getTime() - now;

    if (difference <= 0) {
        document.getElementById("timer").style.display = "none";
        document.getElementById("message").textContent =
            "The wait is over. Your surprise is ready! ❤️";
        document.getElementById("gate").style.display = "block";
        return;
    }

    document.getElementById("days").textContent =
        Math.floor(difference / (1000 * 60 * 60 * 24));

    document.getElementById("hours").textContent =
        Math.floor((difference / (1000 * 60 * 60)) % 24);

    document.getElementById("minutes").textContent =
        Math.floor((difference / (1000 * 60)) % 60);

    document.getElementById("seconds").textContent =
        Math.floor((difference / 1000) % 60);
}

function checkCode() {
    const enteredCode = document.getElementById("secretCode").value;

    if (Date.now() < unlockDate.getTime()) {
        return;
    }

    if (enteredCode === SECRET_CODE) {
        window.location.href = MAIN_WEBSITE;
    } else {
        document.getElementById("error").textContent =
            "Wrong code! Try again ❤️";
    }
}

updateTimer();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
